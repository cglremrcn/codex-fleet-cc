name: Harness P0 review source

on:
  push:
    branches: ["codex/harness-p0-performance-20260908"]
    paths: [".github/workflows/harness-p0-review-source.yml"]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Archive source and exact test dependencies
        run: |
          git archive --format=tar HEAD > "$RUNNER_TEMP/fleet-source.tar"
          tar -czf "$RUNNER_TEMP/fleet-node-modules.tar.gz" node_modules
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-p0-review-source
          path: |
            ${{ runner.temp }}/fleet-source.tar
            ${{ runner.temp }}/fleet-node-modules.tar.gz
          if-no-files-found: error
          retention-days: 1
