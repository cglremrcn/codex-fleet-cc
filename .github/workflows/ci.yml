name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.runner }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-latest
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-14
        node: [18.18.0, 24.19.0]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install the validated Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.234

      - name: Run the release-quality gate
        run: npm run verify

      - name: Capture platform performance evidence
        shell: bash
        run: |
          mkdir -p .fleet-ci
          node scripts/check-performance.mjs > .fleet-ci/performance.json

      - name: Upload performance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-${{ matrix.runner }}-node-${{ matrix.node }}
          path: .fleet-ci/performance.json
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
