name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr15-runtime-patch:
    name: PR15 source patch
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/operator-recovery-ux-20260909' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out PR15 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/operator-recovery-ux-20260909

      - name: Make nested-process preflight advisory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('plugins/fleet/scripts/lib/runtime-adapter.mjs')
          text = runtime.read_text(encoding='utf-8')

          helper_anchor = '''function preflightWarning(check, details) {
            return Object.freeze({ ok: true, status: "warning", check, details, modelTurnStarted: false });
          }
          '''
          helper_replacement = '''function preflightWarning(check, details) {
            return Object.freeze({ ok: true, status: "warning", check, details, modelTurnStarted: false });
          }

          function preflightAdvisory(result) {
            return Object.freeze({
              ...result,
              ok: true,
              status: "warning",
              details: result.reason ?? result.details ?? "Environment capability was not proven.",
              blocking: false,
              modelTurnStarted: false
            });
          }

          function promptWithPreflightAdvisories(prompt, preflight) {
            const warnings = (preflight?.checks ?? []).filter((check) => check?.status === "warning");
            if (warnings.length === 0) return prompt;
            const details = warnings
              .map((check) => `- ${check.check}: ${check.details ?? check.reason ?? "unproven"}`)
              .join("\\n");
            return [
              "Environment preflight advisory (controller-owned verification boundary):",
              details,
              "Do not claim these checks passed. Continue safe implementation that does not depend on them; route blocked completion checks to the controller without repeated retries.",
              "",
              prompt
            ].join("\\n");
          }
          '''
          if helper_anchor not in text:
              raise SystemExit('preflight helper anchor missing')
          text = text.replace(helper_anchor, helper_replacement, 1)

          nested_anchor = '''      checks.push(await this.commandPreflight(lane, [process.execPath, "-e", nestedProcessScript], {
                check: "nested-process"
              }));
              if (checks.at(-1)?.ok === false) return Object.freeze({ ok: false, checks: Object.freeze(checks) });
          '''
          nested_replacement = '''      const nestedProcess = await this.commandPreflight(lane, [process.execPath, "-e", nestedProcessScript], {
                check: "nested-process"
              });
              checks.push(nestedProcess.ok === false ? preflightAdvisory(nestedProcess) : nestedProcess);
          '''
          if nested_anchor not in text:
              raise SystemExit('nested-process anchor missing')
          text = text.replace(nested_anchor, nested_replacement, 1)

          input_anchor = '''        input: this.turnInput(lane, buildExecutionPrompt(prompt, {
                    verificationPlan: lane.verificationPlan,
                    includePosture: false
                  })),
          '''
          input_replacement = '''        input: this.turnInput(lane, buildExecutionPrompt(
                    promptWithPreflightAdvisories(prompt, lane.preflight),
                    {
                      verificationPlan: lane.verificationPlan,
                      includePosture: false
                    }
                  )),
          '''
          if text.count(input_anchor) != 2:
              raise SystemExit(f'expected two execution prompt anchors, got {text.count(input_anchor)}')
          text = text.replace(input_anchor, input_replacement, 2)
          runtime.write_text(text, encoding='utf-8')

          tests = Path('tests/runtime-adapter.test.mjs')
          text = tests.read_text(encoding='utf-8')
          test_anchor = '''test("writer preflight blocks nested-process EPERM before any model turn", async (t) => {
            const fixture = startFakeCodex(t, "command-exec-eperm");
            const runtime = await createRuntime({
              codexCommand: fixture.command,
              dataDir: fixture.dataDir,
              env: fixture.env
            });
            fixture.registerCleanup(runtime);

            const lane = await runtime.startLane(readOnlyContract(fixture, "lane-preflight-eperm", {
              authority: {
                sandbox: "workspace-write",
                network: "off",
                process: { start: true, stopOwned: true }
              }
            }));

            assert.equal(lane.status, "blocked");
            assert.equal(lane.phase, "preflight");
            assert.equal(lane.preflight.ok, false);
            assert.equal(lane.preflight.checks[0].modelTurnStarted, false);
            assert.match(lane.controllerRequest.question, /preflight failed/iu);
            assert.equal(fixture.readState().threads.length, 0);
            assert.equal(fixture.readState().commandExecCalls, 1);
          });
          '''
          test_replacement = '''test("writer preflight makes nested-process EPERM explicit without blocking safe implementation", async (t) => {
            const fixture = startFakeCodex(t, "command-exec-eperm");
            const runtime = await createRuntime({
              codexCommand: fixture.command,
              dataDir: fixture.dataDir,
              env: fixture.env
            });
            fixture.registerCleanup(runtime);

            const lane = await runtime.startLane(readOnlyContract(fixture, "lane-preflight-eperm", {
              authority: {
                sandbox: "workspace-write",
                network: "off",
                process: { start: true, stopOwned: true }
              }
            }));
            const complete = await waitFor(
              () => runtime.inspectLane(lane.id)?.status === "complete" ? runtime.inspectLane(lane.id) : null,
              "advisory-preflight lane completion"
            );

            assert.equal(complete.preflight.ok, true);
            assert.equal(complete.preflight.checks[0].status, "warning");
            assert.equal(complete.preflight.checks[0].blocking, false);
            assert.equal(complete.preflight.checks[0].modelTurnStarted, false);
            assert.match(fixture.readState().lastTurnStart.prompt, /nested-process.*controller-owned verification/is);
            assert.equal(fixture.readState().threads.length, 1);
            assert.equal(fixture.readState().commandExecCalls, 1);
          });
          '''
          if test_anchor not in text:
              raise SystemExit('runtime test anchor missing')
          tests.write_text(text.replace(test_anchor, test_replacement, 1), encoding='utf-8')
          PY

      - name: Commit source correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/fleet/scripts/lib/runtime-adapter.mjs tests/runtime-adapter.test.mjs
          git diff --cached --check
          git commit -m "fix: keep nested-process preflight advisory"
          git push origin HEAD:codex/operator-recovery-ux-20260909

  verify:
    name: ${{ matrix.runner }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-latest
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-14
        node: [22.23.1, 24.18.0]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install the validated Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.252

      - name: Run the release-quality gate
        run: npm run verify

      - name: Capture platform performance evidence
        shell: bash
        run: |
          mkdir -p .fleet-ci
          node scripts/check-performance.mjs > .fleet-ci/performance.json

      - name: Upload performance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ matrix.runner }}-node-${{ matrix.node }}
          path: .fleet-ci/performance.json
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
