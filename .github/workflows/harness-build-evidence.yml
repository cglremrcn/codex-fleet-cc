name: Harness isolated build evidence
on:
  push:
    branches: ["codex/harness-control-center"]
    paths: [".github/workflows/harness-build-evidence.yml"]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Package exact supported Node executable for isolated tests
        run: |
          mkdir -p "$RUNNER_TEMP/harness-node/bin"
          cp "$(command -v node)" "$RUNNER_TEMP/harness-node/bin/node"
          "$RUNNER_TEMP/harness-node/bin/node" --version
          tar -czf "$RUNNER_TEMP/harness-node.tar.gz" -C "$RUNNER_TEMP/harness-node" bin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: harness-supported-node
          path: ${{ runner.temp }}/harness-node.tar.gz
          retention-days: 2
          if-no-files-found: error
