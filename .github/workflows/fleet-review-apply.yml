name: Apply verified Fleet review patch

on:
  push:
    branches: ["harness/navigation-observability-20260906"]
    paths: [".github/workflows/fleet-review-apply.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact transport commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify and apply the already-tested source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3e71dca8b81391a1572cf57c55a9d210bd100dff"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          shas = [
              "09240c9aad6d14890efc03cbf55964f944737ec3",
              "47a554aa50f9ffa82a4ced27981b9be6cf046ef5",
              "8a9dfec5d8acca201efc2116ddbae99f996c53a5",
              "f2d815cf77be1e76b16a31b01049d321cc265a06",
          ]
          chunks = []
          for sha in shas:
              url = "https://api.github.com/repos/cglremrcn/codex-fleet-cc/git/blobs/" + sha
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              chunk = base64.b64decode(payload["content"])
              actual = hashlib.sha1(b"blob " + str(len(chunk)).encode() + b"\0" + chunk).hexdigest()
              if actual != sha:
                  raise SystemExit("Transport blob identity mismatch")
              chunks.append(chunk)
          patch = lzma.decompress(base64.b64decode(b"".join(chunks), validate=True))
          expected = "160d820e59713c3c7c2bd2e1c72e92fe155b3579f9bf3e99c259c485f4e21b42"
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit("Patch checksum mismatch")
          pathlib.Path(os.environ["RUNNER_TEMP"], "fleet-review.patch").write_bytes(patch)
          print("Verified patch SHA-256:", expected)
          PY
          git apply --check --unidiff-zero "$RUNNER_TEMP/fleet-review.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/fleet-review.patch"
          git rm -- .github/workflows/fleet-review-apply.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit -m "feat: group Fleet lanes and harden runtime observability and control identity"
          git push origin HEAD:refs/heads/harness/navigation-observability-20260906
