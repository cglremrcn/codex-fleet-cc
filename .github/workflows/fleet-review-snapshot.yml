name: Fleet review source snapshot

on:
  push:
    branches: ["harness/navigation-observability-20260906"]
    paths: [".github/workflows/fleet-review-snapshot.yml"]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/fleet-review-source.tar"
      - name: Export review source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleet-review-source
          path: ${{ runner.temp }}/fleet-review-source.tar
          if-no-files-found: error
          retention-days: 1
