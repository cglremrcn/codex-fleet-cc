name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    name: Verify ${{ matrix.runner }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-latest
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-14
        node: [22.23.1, 24.18.0]
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install the validated Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.234

      - name: Run the release-quality gate
        run: npm run verify

  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install the validated Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.234

      - name: Run release gate
        run: npm run verify

      - name: Build deterministic release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-check.mjs --version "$VERSION" --require-tag

      - name: Upload immutable release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-fleet-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
