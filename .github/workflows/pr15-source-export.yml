name: PR15 Source Export

on:
  push:
    branches: ["codex/all-findings-operator-hardening-20260909"]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build source archive
        shell: bash
        run: tar --exclude=.git -czf fleet-pr15-source.tgz .
      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleet-pr15-source
          path: fleet-pr15-source.tgz
          if-no-files-found: error
          retention-days: 1
